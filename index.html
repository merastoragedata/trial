async function doFg(){await pull();const u=$('#lu').value,a=ST.auth[u],p=$('#lp').value;if(!a||!a.q)return loginUI('fg','No recovery answer saved. Ask Ashish to reset your PIN.');if(!/^\d{4,6}$/.test(p))return loginUI('fg','New PIN must be 4 to 6 digits');if(await sha($('#la').value.trim().toLowerCase())!=a.q)return loginUI('fg','That is not the saved answer');a.p=await sha(p);save('auth');await e2Setup(u,p,true);enter(u)}
function logout(){ST.sess=ST.me='';save();loginUI('in')}
async function admSet(u){const p=prompt('New PIN for '+P[u]+' (4 to 6 digits)');if(!p)return;if(!/^\d{4,6}$/.test(p))return toast('PIN must be 4 to 6 digits');ST.auth[u]={...(ST.auth[u]||{}),p:await sha(p)};save('auth');render();toast('PIN set for '+P[u])}
function admClr(u){if(!confirm('Remove registration of '+P[u]+'?'))return;delete ST.auth[u];save('auth');render()}
function saveLinks(){const a=$('#lkp').value.trim(),d=$('#lkd').value.trim();if((a&&!/^https:\/\//.test(a))||(d&&!/^https:\/\//.test(d)))return toast('Links must start with https://');ST.links={photos:a,drive:d};save('links');render();toast('Links saved')}
function viewAs(u){ST.me=u;save();render()}
function saveLL(){const v=$('#ll').value.trim();if(v&&!/^https:\/\//.test(v))return toast('Paste the full link starting with https://');ST['ll_'+me()]=v;save('ll_'+me());render();toast('Saved')}
let WID;function locOn(){if(!navigator.geolocation||WID)return;let last=0;WID=navigator.geolocation.watchPosition(p=>{if(Date.now()-last<3e4)return;last=Date.now();ST['loc_'+me()]={lat:p.coords.latitude,lng:p.coords.longitude,ts:Date.now()};save('loc_'+me())},()=>{},{enableHighAccuracy:true})}
function locToggle(c){ST.loc=c?1:0;save();if(c)locOn();else if(WID){navigator.geolocation.clearWatch(WID);WID=0}render()}

return `<h2 class="orh">People and live location</h2><div class="card mine"><b>Share your location until you turn it off</b><ol style="margin:6px 0;padding-left:20px"><li>Open Google Maps, tap your profile picture, then Location sharing.</li><li>Choose New share, set it to "Until you turn this off", and copy the link.</li><li>Paste the link here once. Google Maps keeps sharing in the background, even when this page is closed.</li></ol><input id="ll" type="url" placeholder="Paste your Google Maps share link" value="${ST['ll_'+me()]||''}" style="width:100%;margin:4px 0"><div class="btns"><button class="p" onclick="saveLL()">Save my link</button></div></div>`+'akshltud'.split('').map(p=>{const l=ST['loc_'+p],k=ST['ll_'+p];return `<div class="card"><div class="row"><b>${P[p]}</b><span class="mut">${k?'live link added':l?'seen '+ago(l.ts):'location not shared'}</span></div><div class="btns">${k?`<a class="btn p" href="${k}" target="_blank" rel="noopener">Open live location</a>`:''}${l?`<a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=${l.lat},${l.lng}" target="_blank" rel="noopener">Directions to last seen spot</a>`:''}</div></div>`}).join('')+
`<h3 class="orh" style="margin-top:18px">Backup: share only while this page is open</h3><label class="t"><input type="checkbox" ${ST.loc?'checked':''} onchange="locToggle(this.checked)"><span>Send my position from this page (stops when the page is closed)</span></label>`+

const W=1080,c=document.createElement('canvas'),x=c.getContext('2d'),acc=getComputedStyle(document.body).getPropertyValue('--acc').trim()||'#8c1c2b',hh=l=>l.h?84:l.b?40:34;c.width=W;c.height=130+lines.reduce((a,l)=>a+hh(l),0)+40;

// ---------- trip: flowchart first ----------
let FLI=[];
function flowItems(){const m=me(),ev=[];
T.forEach((t,i)=>{if(px(t[8]).some(x=>x[0]==m))ev.push({k:'t',i,s:D(t[4]),e:D(t[5])})});
Object.entries(stayGroups()).forEach(([k,g])=>{if(g.r.some(s=>s[5].includes(m)))ev.push({k:'s',key:k,g,s:D(g.f),e:D(g.o)})});
PEND.forEach((p,j)=>{if(!/^Atul/.test(p[1])||'tm'.includes(m)){const s=D(p[0]);ev.push({k:'p',j,p,s,e:s})}});
SG.forEach((g,j)=>{const d=dayOf(g[0]);ev.push({k:'v',j,g,s:new Date(+d+324e5),e:new Date(+d+684e5)})});
return ev.sort((a,b)=>a.s-b.s)}
function flowSVG(){calcNext();FLI=flowItems();const W=360,G=36,x0=14,w=W-28;let y=12,s='';if(!FLI.length)return '<p class="mut">No bookings for this person yet.</p>';
FLI.forEach((e,idx)=>{const tr=e.k=='t',st=e.k=='s',pd=e.k=='p',vs=e.k=='v',c=tr?'#1d6fb8':st?'#7b3fc4':vs?'#2e8b57':'#d98b00',H=tr?98:st?82:72,ph=pd?'later':phaseOf(e.s,e.e);
let l1,l2,l3,l4='';
if(tr){const t=T[e.i];l1=`🚆 ${t[1]} ${TR[t[1]][0]}`;l2=`${t[2]} → ${t[3]}`;l3=`${fd(e.s)} ${ft(e.s)} → ${fd(e.e)} ${ft(e.e)}`;l4=px(t[8]).some(x=>x[0]==me())?'Seat '+sT(t,me())+(lateM(t)?'  ·  +'+lateM(t)+' min late':''):'';}
else if(st){const r=e.g.r.filter(x=>x[5].includes(me()))[0]||e.g.r[0];l1='🛏 '+e.g.c;l2=r[0];l3=`In ${fd(e.s)} ${ft(e.s)} · out ${fd(e.e)} ${ft(e.e)}`}
else if(vs){l1='📍 '+e.g[1];l2=e.g[3]||'Place to visit';l3=fd(e.s)+' · tap for map and details'}
else{l1='⏳ '+e.p[1];l2=e.p[2];l3='Not booked / not decided yet · tap for options'}
if(idx){const pv=FLI[idx-1],dot=pd||pv.k=='p';s+=`<path d="M${W/2} ${y-G+2} V${y-9}" stroke="${dot?'#d98b00':c}" stroke-width="3" fill="none" ${dot?'stroke-dasharray="2 6" stroke-linecap="round"':'class="fl"'}/><polygon points="${W/2-6},${y-9} ${W/2+6},${y-9} ${W/2},${y}" fill="${dot?'#d98b00':c}"/>${dot?'':`<circle r="4" fill="${c}"><animateMotion dur="1.6s" repeatCount="indefinite" path="M${W/2} ${y-G+2} V${y}"/></circle>`}`}
const now=ph=='now',op=ph=='done'?.55:1;
s+=`<g class="node fnode ${ph}" style="animation-delay:${Math.min(idx,8)*.08}s;cursor:pointer" opacity="${op}" onclick="flowOpen(${idx})" role="button" tabindex="0" onkeydown="if(event.key=='Enter')flowOpen(${idx})">
${now?`<rect x="${x0-5}" y="${y-5}" width="${w+10}" height="${H+10}" rx="18" fill="none" stroke="#e11d2e" stroke-width="3" class="ringp"/>`:''}
<rect x="${x0}" y="${y}" width="${w}" height="${H}" rx="14" fill="${now?'#e11d2e':c}" fill-opacity="${now?.14:.1}" stroke="${c}" stroke-width="${now?3:2}" ${pd?'stroke-dasharray="6 5"':''}/><rect x="${x0}" y="${y}" width="8" height="${H}" rx="4" fill="${c}"/>
<text x="${x0+20}" y="${y+24}" font-size="15" font-weight="700" fill="${c}">${escx(cut(l1,tr?32:34))}</text><text x="${x0+20}" y="${y+44}" font-size="13" fill="currentColor">${escx(cut(l2,46))}</text><text x="${x0+20}" y="${y+62}" font-size="11.5" fill="currentColor" opacity=".78">${escx(cut(l3,52))}</text>${l4?`<text x="${x0+20}" y="${y+82}" font-size="12.5" font-weight="700" fill="${c}">${escx(l4)}</text>`:''}
${PHL[ph]?`<g><rect x="${W-x0-64}" y="${y+8}" width="56" height="18" rx="9" fill="${ph=='now'?'#e11d2e':ph=='done'?'#6b7a6b':ph=='next'?'#0a8a7a':'#d98b00'}"/><text x="${W-x0-36}" y="${y+21}" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">${PHL[ph]}</text></g>`:''}</g>`;
y+=H+G});
return `<svg viewBox="0 0 ${W} ${y-G+14}" role="img" aria-label="Journey flowchart">${s}</svg>`}
function flowOpen(i){const e=FLI[i];if(!e)return;if(e.k=='t')openT(e.i);else if(e.k=='s')openS(e.key);else if(e.k=='v')openPlace(i);else openPend(e.j)}
function openT(i){const t=T[i],m=me(),k=t[1]+t[4].slice(0,4),g=groups()[k]||[i],ph=phaseOf(D(t[4]),D(t[5])),mine=px(t[8]).find(x=>x[0]==m);

show(`<div class="shh">${phBadge(ph)}<h3>${t[1]} ${TR[t[1]][0]}</h3></div><p class="big">${t[2]} ${ft(D(t[4]))} → ${t[3]} ${ft(D(t[5]))}</p><p class="mut">${fd(D(t[4]))} ${lateB(t)}</p>
<div class="seatbox">${mine?`<small>Your seat</small><b>${sT(t,m)}</b>`:'<small>You are not on this ticket</small>'}</div>
<h4 class="mini">All tickets on this train (you and co-passengers)</h4>${g.map(tk).join('')}
<div class="btns"><button class="p" onclick="wimt('${t[1]}',${i})">Live status</button><button onclick="$('#md').classList.remove('show');go('trains')">Trains page</button></div>`)}
function openS(k){const g=stayGroups()[k],m=me(),ph=phaseOf(D(g.f),D(g.o));
show(`<div class="shh">${phBadge(ph)}<h3>${g.c}</h3></div><p class="mut">In ${fd(D(g.f))} ${ft(D(g.f))} → out ${fd(D(g.o))} ${ft(D(g.o))}</p>${g.r.map(s=>`<div class="card tk ${s[5].includes(m)?'mine':''}"><b>${s[0]}</b><div class="mut">${s[6].replace(s[7],'')}</div><div>${pn(s[7])}</div><div><b>Guests:</b> ${s[5].split('').map(p=>p==m?P[p]+' (you)':P[p]).join(', ')}</div><div class="row"><b>${inr(s[4])}</b><span>${payBy(s[7])}</span></div><div class="btns">${orig(s[7])}</div></div>`).join('')}<div class="btns"><button onclick="sImg('${k}')">Share image</button></div>`)}
const REFS={itin:['Detailed itinerary','pilgrimage-itinerary','reference/pilgrimage-itinerary.pdf'],coach:['Coach layout 11756 · B3','ref-coach'],tvk:['Trivandrum → Kanyakumari trains','ref-tvc-kk'],mra:['Madurai → Rameswaram availability','ref-mdu-rmm-avail'],mrt:['Madurai → Rameswaram timetable','ref-mdu-rmm-time'],n22:['Train 22101 diversion news','ref-22101']};
const refBtn=k=>{const r=REFS[k];return `<button class="btn" onclick="viewOrig('${r[1]}','${r[0]}'${r[2]?",'"+r[2]+"'":''})">📄 ${r[0]}</button>`};
function openPend(j){const p=PEND[j],ref=/Kanyakumari/.test(p[1])?['tvk']:/Rameswaram/.test(p[1])&&/→/.test(p[1])?['mra','mrt']:/Kanchipuram/.test(p[1])&&/→/.test(p[1])?['n22']:[];

function tripView(){const all=allEv(),n=new Date(),days={};all.forEach(e=>{const k=e.s.toDateString();(days[k]=days[k]||[]).push(e)});
const keys=Object.keys(days).sort((a,b)=>new Date(a)-new Date(b)),openK=keys.find(k=>sameDay(new Date(k),n))||keys.find(k=>new Date(k)>n)||keys[keys.length-1],vw=ST.vw;

function hiText(s){const m=/^(\s*)([\s\S]*?)(\s*)$/.exec(s),t=m[2];if(!t)return s;if(HI[t])return m[1]+HI[t]+m[3];let r=t;for(const[re,to]of HIR){if(re.test(r)){r=r.replace(re,to);break}}for(const[a,b]of HIT){if(r.includes(a))r=r.split(a).join(b)}return m[1]+r+m[3]}
function hiPass(root){if(ST.lang!='hi'||!root||HIBUSY)return;HIBUSY=true;try{if(root.nodeType==3){const p=root.parentElement;if(p&&!p.closest('script,style,textarea,.msg>div,.nohi')){const v=hiText(root.nodeValue);if(v!==root.nodeValue)root.nodeValue=v}}
else if(root.nodeType==1){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&n.parentElement.closest('script,style,textarea,.msg>div,.nohi')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});let n;while(n=w.nextNode()){const v=hiText(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}
root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(e=>['placeholder','title','aria-label'].forEach(a=>{const x=e.getAttribute(a);if(x&&HI[x.trim()])e.setAttribute(a,HI[x.trim()])}))}}finally{HIBUSY=false}}
new MutationObserver(ms=>{if(ST.lang!='hi'||HIBUSY)return;ms.forEach(m=>m.addedNodes.forEach(n=>hiPass(n)))}).observe(document.body,{childList:true,subtree:true});

.ytm{display:flex;gap:10px;margin-top:10px;align-items:flex-start}.yta{flex:none;width:36px;height:36px;border-radius:50%;background:#7b3fc4;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}.ytx{flex:1;min-width:0}.ytt{font:500 calc(15px*var(--fs,1))/1.3 Roboto,Arial;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.ytsub{font:400 calc(13px*var(--fs,1))/1.45 Roboto,Arial;color:#606060;margin-top:3px}.ytk{background:none;border:0;font-size:calc(20px*var(--fs,1));color:#0f0f0f;padding:0 6px}

s:[["The land's end",'भारत का अंतिम छोर',`Kanyakumari is the southern tip of mainland India, where the Arabian Sea, the Bay of Bengal and the Indian Ocean meet. Its sunrise over the water, and on some evenings sunset and moonrise together, draw people from every corner of the country.`,`कन्याकुमारी मुख्य भारत का दक्षिणी छोर है जहाँ अरब सागर, बंगाल की खाड़ी और हिंद महासागर मिलते हैं। यहाँ पानी के ऊपर सूर्योदय, और कुछ शामों को सूर्यास्त के साथ चंद्रोदय, देश के हर कोने से लोगों को खींच लाता है।`],

n:['Suchindram Thanumalayan Temple','सुचींद्रम थानुमालयन मंदिर'],c:['Near Kanyakumari, Tamil Nadu','कन्याकुमारी के पास, तमिलनाडु'],g:['One shrine for Shiva, Vishnu and Brahma','शिव, विष्णु और ब्रह्मा का एक ही मंदिर'],
s:[['Three gods, one linga','तीन देव, एक लिंग',`Few temples worship the three great gods together. At Suchindram the deity is Thanumalayan, a name joining Thanu for Shiva, Mal for Vishnu and Ayan for Brahma, all worshipped in a single form.`,`बहुत कम मंदिरों में तीनों महान देवों की एक साथ पूजा होती है। सुचींद्रम में देवता थानुमालयन हैं, यह नाम थानु (शिव), माल (विष्णु) और अयन (ब्रह्मा) को जोड़ता है, और तीनों की पूजा एक ही रूप में होती है।`],
['The legend of Anasuya','अनसूया की कथा',`The story goes that the three gods came in disguise to test the devoted Anasuya, wife of the sage Atri, and she turned them into infants by her purity. They regained their forms only after her request, and the place became sacred.`,`कथा है कि तीनों देव वेश बदलकर साध्वी अनसूया की परीक्षा लेने आए, और उन्होंने अपने पतिव्रत के बल से उन्हें शिशु बना दिया। उनके अनुरोध पर ही देवों को अपना रूप मिला और यह स्थान पवित्र हो गया।`],
['What to look for','क्या देखें',`The towering gopuram is carved with countless figures. Inside, find the huge monolithic Hanuman statue, about eighteen feet tall, and the musical pillars that ring with different notes when gently tapped.`,`ऊँचा गोपुरम अनगिनत मूर्तियों से सजा है। भीतर लगभग अठारह फुट ऊँची एक ही पत्थर की विशाल हनुमान प्रतिमा और संगीतमय स्तंभ देखें, जिन्हें हल्के से थपथपाने पर अलग-अलग स्वर निकलते हैं।`],
['Family tips','परिवार के लिए सुझाव',`Men may be asked to remove shirts and wear a dhoti in the sanctum. Footwear stays outside. It is a calm place, ideal for a short stop on the way between Kanyakumari and Madurai.`,`गर्भगृह में पुरुषों को कमीज़ उतारकर धोती पहनने को कहा जा सकता है। चप्पल बाहर रखें। यह शांत स्थान है और कन्याकुमारी से मदुरै के रास्ते में छोटे ठहराव के लिए आदर्श है।`]],
f:[['The name Suchindram is linked to Indra being purified here, according to legend.','कथा के अनुसार इंद्र यहाँ शुद्ध हुए थे, इसी से सुचींद्रम नाम जुड़ा।'],['Its Hanuman statue is carved from a single stone.','इसकी हनुमान प्रतिमा एक ही पत्थर से गढ़ी गई है।']]},
{k:'madurai',th:'madurai',d:'1203',w:'Meenakshi_Temple',q:'Meenakshi Amman Temple Madurai gopuram',em:'🛕',
n:['Meenakshi Amman Temple, Madurai','मीनाक्षी अम्मन मंदिर, मदुरै'],c:['Madurai, Tamil Nadu','मदुरै, तमिलनाडु'],g:['The city that never sleeps, and its fish-eyed goddess','वह नगर जो कभी नहीं सोता, और मीन-नयनी देवी'],
s:[['A temple that is a city','मंदिर जो एक नगर है',`The Meenakshi Sundareswarar temple stands in the heart of Madurai, with fourteen towering gopurams covered in thousands of brightly painted figures. Streets of the old city spread out around it in concentric squares.`,`मीनाक्षी सुंदरेश्वर मंदिर मदुरै के केंद्र में है, जिसके चौदह ऊँचे गोपुरम हज़ारों रंगीन मूर्तियों से सजे हैं। पुराने शहर की गलियाँ इसके चारों ओर चौकोर घेरों में फैली हैं।`],
['The divine wedding','दिव्य विवाह',`Meenakshi, a form of Parvati born with three breasts and a warrior spirit, ruled Madurai until she met Shiva and the third breast vanished. Their wedding is celebrated every year in the Chithirai festival, one of the greatest of the south.`,`मीनाक्षी, पार्वती का रूप, मदुरै पर शासन करती थीं जब तक शिव से भेंट न हुई। उनका विवाह हर वर्ष चित्तिरै उत्सव में मनाया जाता है, जो दक्षिण भारत के सबसे बड़े उत्सवों में है।`],
['Pillars, tank and evening rite','स्तंभ, सरोवर और संध्या अनुष्ठान',`Wander through the Hall of a Thousand Pillars and the golden lotus tank, Potramarai Kulam. In the evening, the Palliyarai ceremony carries the silver cradle of Sundareswarar in procession to rest beside Meenakshi, with music and flowers.`,`हज़ार स्तंभों वाले मंडप और स्वर्ण-कमल सरोवर पोट्रामरै कुलम में घूमें। शाम को पल्लियरै अनुष्ठान में सुंदरेश्वर की चाँदी की पालकी जुलूस के साथ मीनाक्षी के कक्ष तक ले जाई जाती है, संगीत और फूलों के साथ।`],
['Family tips','परिवार के लिए सुझाव',`Mobile phones are not allowed inside, so use the cloakroom. Modest dress is expected. Plan the evening ceremony around 9 pm, and also visit Thirupparankundram, the first of Murugan's six abodes, on the way.`,`मंदिर के भीतर मोबाइल की अनुमति नहीं है, इसलिए क्लोकरूम का उपयोग करें। शालीन वस्त्र अपेक्षित हैं। रात लगभग 9 बजे की पल्लियरै का समय रखें और रास्ते में मुरुगन के छह धामों में पहले, तिरुप्परंकुन्द्रम, के दर्शन भी करें।`]],
f:[['The temple has fourteen gopurams; the tallest, in the south, is around 170 feet.','मंदिर में चौदह गोपुरम हैं; दक्षिणी सबसे ऊँचा लगभग 170 फुट का है।'],['The Hall of a Thousand Pillars actually has 985 pillars.','हज़ार स्तंभों वाले मंडप में वास्तव में 985 स्तंभ हैं।'],['Madurai is among the oldest continuously inhabited cities in the world.','मदुरै दुनिया के सबसे पुराने लगातार बसे शहरों में गिना जाता है।']]},
{k:'rames',th:'rameswaram',d:'1204',w:'Ramanathaswamy_Temple',q:'Ramanathaswamy Temple Rameswaram corridor',em:'🛕',
n:['Ramanathaswamy Temple, Rameswaram','रामनाथस्वामी मंदिर, रामेश्वरम'],c:['Rameswaram, Tamil Nadu','रामेश्वरम, तमिलनाडु'],g:['The island of Rama, Shiva and 22 holy wells','राम, शिव और 22 पवित्र कुंडों का द्वीप'],
s:[['One of the Char Dhams and a Jyotirlinga','चार धाम और ज्योतिर्लिंग',`Rameswaram is both one of the four holy Dhams and one of the twelve Jyotirlingas. Pilgrims arrive over the Pamban bridge, with the sea on both sides, to bathe at the shore and enter one of India's most majestic temples.`,`रामेश्वरम चार धामों में से एक और बारह ज्योतिर्लिंगों में से एक है। तीर्थयात्री दोनों ओर समुद्र वाले पंबन पुल से आते हैं, तट पर स्नान करते हैं और भारत के सबसे भव्य मंदिरों में से एक में प्रवेश करते हैं।`],
['The linga of Rama','राम का लिंग',`Tradition says Rama, returning after the war in Lanka, worshipped Shiva here. When Hanuman was late bringing a linga from Kailash, Sita shaped one from sand, and both lingas are worshipped to this day.`,`परंपरा है कि लंका युद्ध से लौटते हुए राम ने यहाँ शिव की पूजा की। जब हनुमान कैलास से लिंग लाने में देर कर बैठे तो सीता ने रेत का लिंग बनाया, और आज भी दोनों लिंगों की पूजा होती है।`],
['The corridors and the holy wells','गलियारे और पवित्र कुंड',`The temple's third corridor is among the longest in the world, with rows of carved pillars that seem to meet far away. Inside the complex, pilgrims bathe in twenty-two theerthams, wells whose waters are said to taste different from each other.`,`मंदिर का तीसरा गलियारा दुनिया के सबसे लंबे गलियारों में है, जिसमें नक्काशीदार स्तंभों की कतारें दूर जाकर मिलती दिखती हैं। परिसर में तीर्थयात्री बाईस तीर्थों में स्नान करते हैं, जिनके जल का स्वाद अलग-अलग माना जाता है।`],
['Family tips','परिवार के लिए सुझाव',`Wear light clothes you can get wet; a change of dress is useful for the theertham bath. Keep valuables in the cloakroom. Early morning is the least crowded time, and you can arrive before the afternoon heat.`,`भीगने योग्य हल्के कपड़े पहनें; तीर्थ स्नान के लिए बदलने के कपड़े साथ रखें। कीमती सामान क्लोकरूम में रखें। सुबह का समय सबसे कम भीड़ वाला होता है।`]],
f:[['The third corridor is about 3,800 feet long with over a thousand pillars.','तीसरा गलियारा लगभग 3,800 फुट लंबा है और उसमें हज़ार से अधिक स्तंभ हैं।'],['There are 22 holy theerthams inside the temple.','मंदिर के भीतर 22 पवित्र तीर्थ हैं।']]},
{k:'dhanush',th:'rameswaram',d:'1205',w:'Dhanushkodi',q:'Dhanushkodi Arichal Munai',em:'🌊',
n:['Dhanushkodi','धनुषकोडि'],c:['Rameswaram, Tamil Nadu','रामेश्वरम, तमिलनाडु'],g:['The ghost town where two seas meet','वह भुतहा कस्बा जहाँ दो सागर मिलते हैं'],
s:[['The end of the road','सड़क का अंतिम छोर',`At the south-eastern tip of Pamban island, a long narrow strip of sand runs between the Bay of Bengal and the Indian Ocean. The turquoise water on both sides makes it one of the most striking landscapes in the south.`,`पंबन द्वीप के दक्षिण-पूर्वी छोर पर रेत की लंबी संकरी पट्टी बंगाल की खाड़ी और हिंद महासागर के बीच फैली है। दोनों ओर का फ़िरोज़ी पानी इसे दक्षिण के सबसे अद्भुत दृश्यों में से एक बनाता है।`],
['A town lost to the storm','तूफ़ान में खोया कस्बा',`Dhanushkodi was a busy railway and ferry town until a cyclone struck in December 1964 and washed it away. Ruins of a church, a railway station and a school still stand silent by the sea.`,`दिसंबर 1964 के चक्रवात तक धनुषकोडि रेल और नौका का व्यस्त कस्बा था, जिसे तूफ़ान बहा ले गया। एक चर्च, रेलवे स्टेशन और स्कूल के खंडहर आज भी समुद्र के किनारे खड़े हैं।`],
['Arichal Munai','अरिचल मुनै',`At the very tip, Arichal Munai marks the place where Adam's Bridge, called Ram Setu in tradition, begins toward Sri Lanka. Sri Lanka lies only a short distance across the water.`,`ठीक नोक पर अरिचल मुनै वह स्थान है जहाँ से परंपरा में रामसेतु कहलाने वाला एडम्स ब्रिज श्रीलंका की ओर शुरू होता है। पानी के पार श्रीलंका बहुत कम दूरी पर है।`],
['Family tips','परिवार के लिए सुझाव',`Go in the morning and carry water, a cap and sunscreen; there is almost no shade. Final stretch is sand, so use the jeep or the permitted road. Avoid swimming, as currents are strong.`,`सुबह जाएँ और पानी, टोपी और सनस्क्रीन साथ रखें; छाया लगभग नहीं है। अंतिम हिस्सा रेत का है, इसलिए जीप या अनुमत सड़क का उपयोग करें। तेज़ धारा के कारण तैरें नहीं।`]],
f:[['The 1964 cyclone destroyed the town and a passenger train nearby.','1964 के चक्रवात ने कस्बे और पास की एक यात्री ट्रेन को नष्ट कर दिया।'],['Two seas meet at Arichal Munai.','अरिचल मुनै पर दो सागर मिलते हैं।']]},
{k:'trichy',th:'madurai',d:'1206',w:'Rockfort,_Tiruchirappalli',q:'Rockfort Temple Tiruchirappalli',em:'⛰️',
n:['Rockfort, Thiruvanaikaval and Samayapuram','रॉकफ़ोर्ट, तिरुवानैकावल और समयपुरम'],c:['Tiruchirappalli, Tamil Nadu','तिरुचिरापल्ली, तमिलनाडु'],g:['A rock, a river island and a village goddess','एक चट्टान, एक नदी-द्वीप और ग्राम देवी'],
s:[['The Rockfort','रॉकफ़ोर्ट',`A great rock, billions of years old, rises abruptly from the flat plain of Trichy. A long flight of steps climbs past shrines to the Ucchi Pillayar temple at the top, where Ganesha looks over the city and the Kaveri river.`,`त्रिची के समतल मैदान से अचानक एक विशाल चट्टान उठती है, जो अरबों वर्ष पुरानी मानी जाती है। लंबी सीढ़ियाँ मंदिरों से होते हुए शिखर पर उच्ची पिल्लैयार मंदिर तक जाती हैं, जहाँ गणेश शहर और कावेरी नदी को निहारते हैं।`],
['The water temple','जल का मंदिर',`At Thiruvanaikaval, the Jambukeswarar temple is the Panchabhuta shrine of water. A spring rises inside the sanctum, and the legend says an elephant worshipped Shiva here, which gave the place its name.`,`तिरुवानैकावल का जंबुकेश्वर मंदिर जल तत्व का पंचभूत स्थल है। गर्भगृह के भीतर जल का स्रोत है, और कथा है कि एक हाथी ने यहाँ शिव की पूजा की थी, इसी से स्थान का नाम पड़ा।`],
['Samayapuram and Srirangam','समयपुरम और श्रीरंगम',`Samayapuram Mariamman is a much-loved village goddess, visited for health and protection. If time allows, Srirangam nearby is one of the largest functioning temple complexes in the world.`,`समयपुरम की मरियम्मन अत्यंत प्रिय ग्राम देवी हैं, जिनके दर्शन स्वास्थ्य और रक्षा के लिए किए जाते हैं। समय हो तो पास का श्रीरंगम दुनिया के सबसे बड़े सक्रिय मंदिर परिसरों में से एक है।`],
['Family tips','परिवार के लिए सुझाव',`The Rockfort climb has hundreds of steps and no lift, so elders should go slowly or wait at a shrine on the way. Keep to the morning, drink water often and keep footwear in the stalls provided.`,`रॉकफ़ोर्ट की चढ़ाई में सैकड़ों सीढ़ियाँ हैं और लिफ्ट नहीं है, इसलिए बुज़ुर्ग धीरे चलें या रास्ते के मंदिर में रुकें। सुबह का समय रखें, पानी पीते रहें और चप्पल निर्धारित स्थान पर रखें।`]],
f:[['The Rockfort rock is said to be older than the Himalayas.','कहा जाता है कि रॉकफ़ोर्ट की चट्टान हिमालय से भी पुरानी है।'],['Jambukeswarar is the temple of the water element among the five great Shiva temples.','जंबुकेश्वर पाँच महान शिव मंदिरों में जल तत्व का मंदिर है।']]},
{k:'tirumala',th:'tirumala',d:'1208',w:'Venkateswara_Temple,_Tirumala',q:'Tirumala Venkateswara Temple',em:'🛕',
n:['Tirumala Sri Venkateswara Temple','तिरुमला श्री वेंकटेश्वर मंदिर'],c:['Tirumala, Andhra Pradesh','तिरुमला, आंध्र प्रदेश'],g:['The abode of Balaji on the seven hills','सात पहाड़ियों पर बालाजी का धाम'],
s:[['The Lord of the seven hills','सात पहाड़ियों के स्वामी',`High on the Seshachalam hills, the temple of Sri Venkateswara, also called Balaji or Govinda, is among the most visited places of worship in the world. The hills are said to be the seven heads of the serpent Adisesha.`,`शेषाचलम की पहाड़ियों पर श्री वेंकटेश्वर, जिन्हें बालाजी या गोविंदा कहते हैं, का मंदिर दुनिया के सबसे अधिक दर्शन किए जाने वाले स्थलों में है। कहा जाता है कि ये पहाड़ियाँ आदिशेष के सात फन हैं।`],
['The golden sanctum','स्वर्ण गर्भगृह',`The main idol stands in the Ananda Nilayam under a gilded vimana. Pilgrims offer their hair as a sign of surrender, and many walk up the old footpath from Alipiri. The temple is run by the Tirumala Tirupati Devasthanams.`,`मुख्य मूर्ति आनंद निलयम में स्वर्ण विमान के नीचे विराजमान है। श्रद्धालु समर्पण के भाव से केश अर्पित करते हैं और बहुत से लोग अलिपिरि के पुराने पैदल मार्ग से चढ़ते हैं। मंदिर का संचालन तिरुमला तिरुपति देवस्थानम करता है।`],
['The laddu and the festivals','लड्डू और उत्सव',`The temple laddu, given as prasadam, carries a Geographical Indication tag and is famous across India. The biggest festival is the nine-day Brahmotsavam, when the deity is carried on grand processional vehicles.`,`प्रसाद के रूप में मिलने वाले मंदिर के लड्डू को भौगोलिक संकेत (GI) का दर्जा मिला है और वे पूरे भारत में प्रसिद्ध हैं। सबसे बड़ा उत्सव नौ दिन का ब्रह्मोत्सव है जिसमें भगवान भव्य वाहनों पर विराजमान होकर निकलते हैं।`],
['Family tips','परिवार के लिए सुझाव',`Keep the darshan ticket and ID ready, wear traditional clothes and leave phones in the lockers. Waits can be long, so carry only essentials. Be patient, drink water and pace elders. Visit the beautiful Akasa Ganga and Papavinasam if time allows.`,`दर्शन टिकट और पहचान पत्र तैयार रखें, पारंपरिक वस्त्र पहनें और मोबाइल लॉकर में रखें। प्रतीक्षा लंबी हो सकती है, इसलिए केवल ज़रूरी सामान लें। धैर्य रखें, पानी पिएँ और बुज़ुर्गों को आराम से चलाएँ। समय हो तो आकाश गंगा और पापविनाशम भी देखें।`]],

s:[['Padmavathi at Tiruchanur','तिरुचानूर की पद्मावती',`Tiruchanur is the temple of Goddess Padmavathi, also called Alamelumanga, the consort of Venkateswara. Many pilgrims follow the tradition of seeing her before or after Tirumala, as the visit is believed to complete the pilgrimage.`,`तिरुचानूर में देवी पद्मावती, जिन्हें अलमेलुमंगा भी कहते हैं, वेंकटेश्वर की अर्धांगिनी का मंदिर है। कई तीर्थयात्री परंपरा के अनुसार तिरुमला से पहले या बाद में उनके दर्शन करते हैं, माना जाता है कि इससे यात्रा पूर्ण होती है।`],
['The wind temple','वायु का मंदिर',`Srikalahasti is the Panchabhuta temple of air. It is famous for the lamp in the sanctum whose flame flickers though there is no window, and for Rahu-Ketu pujas. It honours the devotion of Kannappa, the hunter who offered his eyes to Shiva.`,`श्रीकालहस्ती वायु तत्व का पंचभूत मंदिर है। यह गर्भगृह के उस दीपक के लिए प्रसिद्ध है जिसकी लौ बिना खिड़की के भी हिलती है, और राहु-केतु पूजा के लिए। यह उस शिकारी कन्नप्पा की भक्ति का स्मरण कराता है जिसने शिव को अपनी आँखें अर्पित की थीं।`],
['Kapila Theertham','कपिला तीर्थम',`At the foot of the hills in Tirupati, Kapila Theertham is a Shiva temple where a waterfall pours into a holy pool. It is a cool and peaceful place to end the day.`,`तिरुपति में पहाड़ियों की तलहटी पर कपिला तीर्थम एक शिव मंदिर है जहाँ जलप्रपात पवित्र कुंड में गिरता है। दिन समाप्त करने के लिए यह ठंडी और शांत जगह है।`],

s:[['One of the seven sacred cities','सात पवित्र नगरियों में से एक',`Kanchipuram is one of the seven moksha-giving cities of India and was the proud capital of the Pallava kings. Its streets are lined with temples, weaving houses and shops selling the glowing Kanchipuram silk sarees.`,`कांचीपुरम भारत की सात मोक्षदायिनी नगरियों में से एक है और पल्लव राजाओं की गौरवशाली राजधानी रहा है। इसकी गलियाँ मंदिरों, बुनकरों के घरों और चमकदार कांजीवरम रेशमी साड़ियों की दुकानों से भरी हैं।`],
['Four temples to visit','चार मंदिर',`Kamakshi Amman is a powerful Shakti shrine. Ekambareswarar is the temple of the earth element, beside an ancient mango tree. Varadharaja Perumal is a grand Vishnu temple, and Kailasanathar is a glowing eighth-century Pallava temple carved in sandstone.`,`कामाक्षी अम्मन शक्ति का प्रभावशाली स्थल है। एकांबरेश्वर पृथ्वी तत्व का मंदिर है जो एक प्राचीन आम के वृक्ष के पास है। वरदराज पेरुमाल विष्णु का भव्य मंदिर है, और कैलासनाथर आठवीं सदी का बलुआ पत्थर में गढ़ा चमकदार पल्लव मंदिर है।`],

async function mgImgs(m){if(MG.imgs[m.k])return MG.imgs[m.k];try{const c=JSON.parse(L.g('mgi3_'+m.k,'null'));if(c&&c.length)return MG.imgs[m.k]=c}catch(e){}const out=[];

const seen=new Set(),res=out.filter(x=>!seen.has(x.u)&&seen.add(x.u)).slice(0,24);if(res.length){MG.imgs[m.k]=res;try{L.s('mgi3_'+m.k,JSON.stringify(res))}catch(e){}}return res}

const PLG={"padmanabha":["Sree Padmanabhaswamy Temple","One of the 108 Divya Desams, associated with the Travancore royal family and the city's name (Thiru-anantha-puram).","Darshan is in several short slots from early morning to midday and again in the evening. Check the day's timings at the gate.","Men: mundu/dhoti, no shirt or upper cloth rules apply. Women: saree, half-saree or set-mundu. No trousers or shorts.","Phones, cameras and bags are not allowed inside; lockers are outside. Keep ID handy. Plan 2–3 hours.","Try Kerala sadya, appam with stew, and banana chips from the East Fort lanes.","East Fort, Kuthiramalika Palace, Shankhumukham Beach"],"shankhumukham":["Shanghumugham Beach","A public beach beside the old Valiyathura area; a popular place for evening sunsets.","Best from 4 pm to sunset. Open all day.","Normal modest clothing.","Do not enter deep water; waves are strong. Evening is cooler and crowded.","Roadside tender coconut and fresh fish fry stalls (veg options: corn and sundal).","Veli Tourist Village, Kovalam Beach"],"kanyakumari":["Vivekananda Rock Memorial & Cape Sunrise","Swami Vivekananda meditated here in 1892; the memorial was built in 1970.","Ferries run from about 8 am to 4 pm. Sunrise is around 6 am from the sea-front.","Modest clothing; footwear is left before the memorial.","Queue early for the ferry (tickets at the jetty). Sea can be rough; carry a cap and water.","Fresh south Indian meals, filter coffee and nendran chips.","Kumari Amman Temple, Thiruvalluvar Statue, Gandhi Memorial"],"kumariamman":["Kumari Amman Temple","Tradition says the goddess waited here for Lord Shiva; the sanctum has a diamond nose-ring that shines out to sea.","Early morning to midday and again late afternoon to night. Check the board outside.","Men: remove shirts at the sanctum in many shrines here; traditional clothing preferred.","Mobiles and cameras are not allowed inside. Footwear stands are outside.","Simple vegetarian meals near the car street.","Gandhi Mandapam, Sunset Point"],"suchindram":["Thanumalayan Temple, Suchindram","Known for the 134 ft gopuram, musical pillars and a huge Hanuman statue.","Morning and evening darshan; closed in the afternoon.","Dhoti or trousers without a shirt for men inside; sarees for women is the usual practice.","Do not miss the musical pillars and the large Nandi. Go in the morning.","Local plantain-leaf meals nearby.","Nagercoil, Kanyakumari"],"meenakshi":["Meenakshi Amman Temple","Rebuilt in its present form in the 16th–17th centuries under the Nayaks; a living temple town.","Opens before dawn, closes midday, reopens late afternoon. The evening Palliyarai ceremony takes the deity to rest.","Modest clothing; no shorts or sleeveless. Men often wear dhoti or trousers.","Mobiles are not allowed inside the temple; use the locker at the gate. The sculpture museum inside is worth a look.","Jigarthanda, kari dosa (veg: ghee pongal and filter coffee), idli with sambar.","Thirumalai Nayakkar Mahal, Vandiyur Mariamman Teppakulam"],"thirupparankundram":["Thiruparankundram Murugan Temple","A rock-cut cave temple said to be where Murugan married Deivanai.","Open from early morning to night with a midday break.","Modest clothing; temple dress norms apply.","About 9 km from Madurai city. Combine with the Meenakshi evening ceremony.","Roadside tender coconut and murukku.","Pazhamudircholai, Madurai city"],"ramanathaswamy":["Ramanathaswamy Temple","Said to be where Lord Rama worshipped Shiva after returning from Lanka; the temple has 22 holy wells (theerthams).","Early morning (around 5 am) to afternoon, and again from late afternoon to night.","Wear dry modest clothing after the theertham bath; men: dhoti or trousers.","Do the 22-theertham bath first with a guide (use the official counters). Keep a spare dry set. No mobiles inside.","Fresh seafood is common; vegetarian meals and tiffin are available near the temple.","Dhanushkodi, Pamban Bridge, Kalam Memorial"],"dhanushkodi":["Dhanushkodi","Destroyed by a cyclone in 1964; today a quiet stretch of white sand with ruins of a church and railway station.","Visit between 6 am and 5–6 pm; vehicles are not allowed after dusk.","Light cotton clothes, cap, sunglasses.","Shared vans run from Rameswaram to the end point. Carry water and sun protection.","Few stalls; carry snacks.","Pamban Bridge, Arichal Munai"],"rockfort":["Rockfort Ucchi Pillayar Temple","The rock is about 3,400 million years old; the Pallavas and Nayaks cut temples into it.","Open morning to evening; last climb about 8 pm.","Footwear is left at the base (there are 400+ steps).","The climb takes 20–30 minutes; take water and a stop at the mid-point. Not easy for those with knee trouble.","Trichy has famous sweet-shop snacks and filter coffee.","Srirangam Ranganathaswamy Temple, Jambukeswarar"],"jambukeswarar":["Jambukeswarar Temple, Thiruvanaikaval","A 1,800-year-old Chola-era temple dedicated to Shiva and Akilandeswari.","Morning to afternoon, then late afternoon to night.","Modest clothing; mobile rules vary.","Near Srirangam; combine both on one trip.","Local meals near Srirangam.","Srirangam, Rockfort"],"samayapuram":["Samayapuram Mariamman Temple","Associated with the Mariamman goddess; busy on Sundays and Fridays.","Open daily from morning to night.","Modest clothing.","Go on a weekday if possible.","Prasadam and pongal at the temple.","Kollidam river, Trichy city"],"tirumala":["Tirumala Venkateswara Temple","Lord Venkateswara (Balaji) is believed to have taken the form of Vishnu in Kali Yuga; managed by TTD.","Open about 18–20 hours a day; the main darshan queue can be 4–12 hours without special entry.","Traditional clothing is required for special darshan (dhoti/saree, not jeans).","Book Special Entry Darshan and rooms in advance. Aadhaar is needed for registration. The Alipiri path is 3,550 steps. Keep belongings in lockers.","Free anna-prasadam meals at the Matrusri Tarigonda Vengamamba complex; the famous laddu is the prasadam.","Tiruchanoor, Srikalahasti, Kapila Theertham"],"tiruchanoor":["Padmavathi Temple, Tiruchanoor","Tradition says pilgrims should visit Padmavathi before visiting Tirumala.","Early morning to night with short breaks.","Traditional modest clothing.","Visit the day before or after Tirumala.","Prasadam and snacks near the temple.","Tirupati, Govindaraja Swamy temple"],"srikalahasti":["Srikalahasti Temple","A 5th-century Pallava-origin temple built next to a hill.","Morning to night; Rahu Ketu puja is at fixed hours.","Modest clothing; men may be asked to remove shirts at the sanctum.","About 36 km from Tirupati. Pay for pujas only at official counters.","Local meals near the temple.","Tirupati, Kapila Theertham"],"kapila":["Kapila Theertham","The lingam is believed to have been installed by sage Kapila.","Open through the day.","Modest clothing; wet clothes should be changed.","Stand-by for slippery rocks near the falls.","Small stalls nearby.","Tirupati, Tiruchanoor"],"kamakshi":["Kamakshi Amman Temple","A temple of Goddess Kamakshi with golden gopuram and close to the Kanchi Kamakoti Peetham.","Morning to midday and late afternoon to night.","Traditional modest dress.","Visit Ekambareswarar and Varadharaja Perumal on the same day by auto.","Kanchipuram idli, a special temple-style idli, is a must-try.","Ekambareswarar, Kailasanathar"],"ekambareswarar":["Ekambareswarar Temple","A Pallava–Chola temple with one of the tallest gopurams in South India.","Open morning to night.","Modest clothing.","Look for the mango tree with four branches (said to represent the four Vedas).","Kanchipuram idli near the temple.","Kamakshi, Varadharaja"],"varadharaja":["Varadharaja Perumal Temple","A 11th-century Chola-era temple, among the 108 Divya Desams.","Morning to night with short breaks.","Modest traditional clothing.","The Athi Varadar (every 40 years) is a famous event; check if the special idol is on view.","Local sweets and idli nearby.","Ekambareswarar, Kanchi silk shops"],"kailasanathar":["Kailasanathar Temple","Built by the Pallava king Rajasimha around 700 CE with beautifully carved sandstone shrines.","Morning and evening visits; short midday break.","Modest clothing.","Quieter than the other temples; good for photographs.","Small tea and snack stalls outside.","Kamakshi, Ekambareswarar"],"nagpur":["Deekshabhoomi and Nagpur","Nagpur sits at the geographic centre of India (Zero Mile stone).","Open day time.","Modest clothing.","Retiring dorms at NSC Bose Itwari station suit a short stop.","Saoji mutton is famous; vegetarian options include poha and tarri.","Zero Mile, Ambazari Lake"],"vijayawada":["Kanaka Durga Temple, Vijayawada","Associated with Arjuna's penance on Indrakeeladri hill.","Morning to night.","Traditional clothing for special darshan.","Prakasam Barrage and Undavalli Caves are close.","Andhra meals; try pootharekulu sweets.","Undavalli Caves, Prakasam Barrage"]};

const PLGH={"padmanabha":["श्री पद्मनाभस्वामी मंदिर","108 दिव्य देशमों में से एक; त्रावणकोर राजपरिवार से जुड़ा और शहर के नाम (तिरु-अनंत-पुरम) का आधार।","दर्शन सुबह-सुबह से दोपहर तक और शाम को कई छोटे समय-खंडों में होते हैं। उस दिन का समय द्वार पर जाँच लें।","पुरुष: मुंडु/धोती, ऊपर कमीज़ नहीं पहनी जाती। महिलाएँ: साड़ी, हाफ़-साड़ी या सेट-मुंडु। पैंट या शॉर्ट्स नहीं।","फ़ोन, कैमरे और बैग भीतर नहीं ले जा सकते; लॉकर बाहर हैं। पहचान-पत्र साथ रखें। 2–3 घंटे का समय रखें।","ईस्ट फ़ोर्ट की गलियों में केरल की सद्या, अप्पम-स्टू और केले के चिप्स ज़रूर चखें।","ईस्ट फ़ोर्ट, कुतिरमालिका महल, शंखुमुखम बीच"],
"shankhumukham":["शंखुमुखम बीच","पुराने वलियाथुरा क्षेत्र के पास का सार्वजनिक समुद्र तट; शाम के सूर्यास्त के लिए लोकप्रिय।","शाम 4 बजे से सूर्यास्त तक सबसे अच्छा। दिन भर खुला।","सामान्य शालीन कपड़े।","गहरे पानी में न उतरें; लहरें तेज़ हैं। शाम ठंडी और भीड़-भरी होती है।","सड़क किनारे नारियल पानी और ताज़ी मछली के ठेले (शाकाहारी: भुट्टा और सुंदल)।","वेली टूरिस्ट विलेज, कोवलम बीच"],
"kanyakumari":["विवेकानंद शिला स्मारक और केप का सूर्योदय","स्वामी विवेकानंद ने 1892 में यहाँ ध्यान किया; स्मारक 1970 में बना।","फ़ेरी लगभग सुबह 8 से शाम 4 बजे तक चलती है। समुद्र-तट से सूर्योदय लगभग सुबह 6 बजे दिखता है।","शालीन कपड़े; स्मारक से पहले जूते-चप्पल उतारने होते हैं।","फ़ेरी के लिए जल्दी कतार में लगें (टिकट घाट पर)। समुद्र उबड़-खाबड़ हो सकता है; टोपी और पानी साथ रखें।","ताज़ा दक्षिण भारतीय भोजन, फ़िल्टर कॉफ़ी और नेंद्रन चिप्स।","कुमारी अम्मन मंदिर, तिरुवल्लुवर प्रतिमा, गांधी स्मारक"],
"kumariamman":["कुमारी अम्मन मंदिर","मान्यता है कि देवी यहाँ भगवान शिव की प्रतीक्षा में रहीं; गर्भगृह की हीरे की नथ समुद्र तक चमकती है।","सुबह-सुबह से दोपहर तक और फिर देर दोपहर से रात तक। बाहर लगा बोर्ड देख लें।","पुरुष: यहाँ के कई मंदिरों में गर्भगृह में कमीज़ उतारनी होती है; पारंपरिक वस्त्र बेहतर।","मोबाइल और कैमरे भीतर मना हैं। जूते-चप्पल रखने का स्टैंड बाहर है।","कार स्ट्रीट के पास सादा शाकाहारी भोजन।","गांधी मंडपम, सनसेट पॉइंट"],

"ramanathaswamy":["रामनाथस्वामी मंदिर","मान्यता है कि लंका से लौटकर भगवान राम ने यहाँ शिव की पूजा की; मंदिर में 22 पवित्र कुएँ (तीर्थम) हैं।","सुबह लगभग 5 बजे से दोपहर तक, और फिर देर दोपहर से रात तक।","तीर्थम स्नान के बाद सूखे शालीन कपड़े पहनें; पुरुष: धोती या पैंट।","पहले गाइड के साथ 22 तीर्थम स्नान करें (आधिकारिक काउंटर से)। सूखे कपड़ों का एक अतिरिक्त जोड़ा रखें। भीतर मोबाइल नहीं।","ताज़ा समुद्री भोजन आम है; मंदिर के पास शाकाहारी भोजन और टिफ़िन मिलते हैं।","धनुषकोडी, पंबन पुल, कलाम स्मारक"],

"jambukeswarar":["जंबुकेश्वर मंदिर, तिरुवनैकावल","शिव और अखिलांडेश्वरी को समर्पित, 1,800 वर्ष पुराना चोल-कालीन मंदिर।","सुबह से दोपहर, फिर देर दोपहर से रात तक।","शालीन कपड़े; मोबाइल के नियम बदलते रहते हैं।","श्रीरंगम के पास; दोनों को एक ही यात्रा में जोड़ें।","श्रीरंगम के पास स्थानीय भोजन।","श्रीरंगम, रॉकफ़ोर्ट"],

"kapila":["कपिला तीर्थम","माना जाता है कि शिवलिंग की स्थापना कपिल मुनि ने की थी।","दिन भर खुला।","शालीन कपड़े; गीले कपड़े बदल लें।","झरने के पास की फिसलन भरी चट्टानों से सावधान रहें।","पास में छोटे ठेले।","तिरुपति, तिरुचानूर"],

const TEAMS={S:{n:'Team Suresh',hn:'Suresh',head:'u',m:'uhld'},A:{n:'Team Ashish',hn:'Ashish',head:'a',m:'asktv'}};
function teamCalc(A){const r={};Object.keys(TEAMS).forEach(k=>{const g=TEAMS[k].m.split('');r[k]={g,share:g.reduce((x,p)=>x+A.sum(p),0),paid:g.reduce((x,p)=>x+A.pd[p],0)}});
 const cross=(f,t)=>ST.pm.filter(m=>f.includes(m.f)&&t.includes(m.t)).reduce((x,m)=>x+(+m.amt||0),0);
 r.S.sent=cross(TEAMS.S.m,TEAMS.A.m);r.S.recv=cross(TEAMS.A.m,TEAMS.S.m);r.A.sent=r.S.recv;r.A.recv=r.S.sent;
 ['S','A'].forEach(k=>r[k].net=r[k].paid+r[k].sent-r[k].recv-r[k].share);
 const x=(r.A.net-r.S.net)/2;r.amt=Math.abs(x);r.from=x>0?'S':'A';r.to=x>0?'A':'S';return r}

 const box=(k,x)=>{const t=TEAMS[k],c=r[k].net>=0?'#2a7d45':'#d33';return `<g><rect x="${x}" y="22" width="130" height="92" rx="14" fill="${c}" opacity=".13" stroke="${c}" stroke-width="1.5"/><text x="${x+65}" y="46" text-anchor="middle" font-size="15" font-weight="800" fill="currentColor">${t.n}</text><text x="${x+65}" y="62" text-anchor="middle" font-size="10" fill="currentColor">${t.m.split('').slice(0,2).map(p=>P[p].split(' ')[0]).join(' · ')}</text><text x="${x+65}" y="75" text-anchor="middle" font-size="10" fill="currentColor">${t.m.split('').slice(2).map(p=>P[p].split(' ')[0]).join(' · ')}</text><text x="${x+65}" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="${c}">${r[k].net>=0?rt2('is owed','पाना है'):rt2('owes','देना है')} ${inr(Math.abs(r[k].net))}</text></g>`};
 let arrow='';if(ok)arrow=`<text x="180" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#2a7d45">${rt2('Settled','हिसाब बराबर')} ✔</text>`;else{const ltr=r.from=='S';const x1=ltr?146:214,x2=ltr?214:146;arrow=`<defs><marker id="tah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#2a7d45"/></marker></defs><path d="M${x1} 68 L${x2} 68" stroke="#2a7d45" stroke-width="4" marker-end="url(#tah)" fill="none"/><text x="180" y="56" text-anchor="middle" font-size="13" font-weight="800" fill="currentColor">${inr(r.amt)}</text><text x="180" y="88" text-anchor="middle" font-size="10" fill="currentColor">${rt2('pays','देगा')}</text>`}
 const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Team settle-up" style="width:100%;height:auto">${box('S',8)}${box('A',222)}${arrow}</svg>`;
 const line=ok?rt2('Both teams are square. Nothing to pay between the teams.','दोनों टीमों का हिसाब बराबर है।'):`<b>${TEAMS[r.from].n}</b> ${rt2('pays','को देना है')} <b>${inr(r.amt)}</b> ${rt2('to','→')} <b>${TEAMS[r.to].n}</b>`;
 const card=k=>{const t=TEAMS[k],q=r[k];return `<details class="tmc"><summary><b>${t.n}</b> · ${rt2('under','प्रमुख')} ${t.hn} <span class="mut">${rt2('balance','शेष')} ${q.net>=0?'+':'−'}${inr(Math.abs(q.net))}</span></summary><table><tr><td>${rt2('Expenses of all members (combined)','सभी सदस्यों का कुल खर्च')}</td><td class="r">${inr(q.share)}</td></tr><tr><td>${rt2('Paid to vendors by the team','टीम द्वारा विक्रेताओं को भुगतान')}</td><td class="r">+${inr(q.paid)}</td></tr><tr><td>${rt2('Paid to the other team','दूसरी टीम को दिया')}</td><td class="r">+${inr(q.sent)}</td></tr><tr><td>${rt2('Received from the other team','दूसरी टीम से मिला')}</td><td class="r">−${inr(q.recv)}</td></tr><tr class="stot"><td><b>${rt2('Balance (+ is owed to the team)','शेष (+ यानी टीम को मिलना है)')}</b></td><td class="r"><b>${q.net>=0?'+':'−'}${inr(Math.abs(q.net))}</b></td></tr></table><table class="tmm"><tr><th>${rt2('Member','सदस्य')}</th><th class="r">${rt2('Share','हिस्सा')}</th><th class="r">${rt2('Paid','भुगतान')}</th></tr>${q.g.map(p=>`<tr><td>${P[p]}</td><td class="r">${inr(A.sum(p))}</td><td class="r">${inr(A.pd[p])}</td></tr>`).join('')}</table><p class="mut" style="font-size:.8rem">${rt2('Payments between members of the same team cancel out.','एक ही टीम के सदस्यों के बीच के भुगतान आपस में कट जाते हैं।')}</p></details>`};
