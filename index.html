const SALT='yatra26|';
async function sha(t){if(typeof crypto!='undefined'&&crypto.subtle)return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(SALT+t)))].map(b=>b.toString(16).padStart(2,'0')).join('');let h=5381;for(const ch of SALT+t)h=(h*33^ch.charCodeAt(0))>>>0;return 'x'+h}
const NAMES=Object.keys(P),opts=(sel)=>NAMES.map(k=>`<option value="${k}" ${sel==k?'selected':''}>${P[k]}</option>`).join('');

reg:`<h3>Register</h3><select id="lu">${opts('a')}</select><input id="lp" type="password" inputmode="numeric" maxlength="6" placeholder="Choose a PIN (4 to 6 digits)"><input id="lp2" type="password" inputmode="numeric" maxlength="6" placeholder="Repeat the PIN"><input id="la" type="text" placeholder="Recovery: your grandmother's name"><div class="btns"><button class="p" onclick="doReg()">Register</button><button onclick="loginUI('in')">Back</button></div>`,
fg:`<h3>Forgot PIN</h3><select id="lu">${opts('a')}</select><input id="la" type="text" placeholder="Your grandmother's name"><input id="lp" type="password" inputmode="numeric" maxlength="6" placeholder="New PIN (4 to 6 digits)"><div class="btns"><button class="p" onclick="doFg()">Set new PIN</button><button onclick="loginUI('in')">Back</button></div><p class="mut">If you cannot remember, ask Ashish to reset your PIN.</p>`}[mode];
e.innerHTML=`<div class="lbox"><div class="lorn">${orn}</div><h2>Yatra Portal 2026</h2>${msg?`<p class="err">${msg}</p>`:''}${h}${SB.url?'':'<p class="mut">Registrations are saved on this phone only until the shared database is switched on.</p>'}</div>`}
function enter(u){ST.sess=ST.me=u;save();$('#lg').classList.remove('show');render()}
async function doLogin(){const u=$('#lu').value,a=ST.auth[u];if(!a)return loginUI('in','Not registered yet. Tap Register.');if(await sha($('#lp').value)!=a.p)return loginUI('in','Wrong PIN');enter(u)}
async function doReg(){await pull();const u=$('#lu').value,p=$('#lp').value;if(ST.auth[u])return loginUI('reg','Already registered. Use Log in, or Forgot PIN.');if(!/^\d{4,6}$/.test(p))return loginUI('reg','PIN must be 4 to 6 digits');if(p!=$('#lp2').value)return loginUI('reg','The two PINs do not match');const q=$('#la').value.trim().toLowerCase();if(!q)return loginUI('reg','Enter your grandmother\'s name');
ST.auth[u]={p:await sha(p),q:await sha(q)};save('auth');enter(u)}
async function doFg(){await pull();const u=$('#lu').value,a=ST.auth[u],p=$('#lp').value;if(!a||!a.q)return loginUI('fg','No recovery answer saved. Ask Ashish to reset your PIN.');if(!/^\d{4,6}$/.test(p))return loginUI('fg','New PIN must be 4 to 6 digits');if(await sha($('#la').value.trim().toLowerCase())!=a.q)return loginUI('fg','That is not the saved answer');a.p=await sha(p);save('auth');enter(u)}
function logout(){ST.sess=ST.me='';save();loginUI('in')}

function wind8(el,m,cur){const cv=document.createElement('canvas');cv.className='wxwind8';el.appendChild(cv);const ctx=cv.getContext('2d');const fit=()=>{cv.width=el.clientWidth;cv.height=el.clientHeight};fit();addEventListener('resize',fit);
const sp=Math.min(30,(cur.wind_speed_10m||5)),dr=((cur.wind_direction_10m||0)+180)*Math.PI/180;const N=90,P=[];const rnd=()=>Math.random();for(let i=0;i<N;i++)P.push({x:rnd()*cv.width,y:rnd()*cv.height,a:rnd()});
const vx=Math.sin(dr)*(0.4+sp/18),vy=-Math.cos(dr)*(0.4+sp/18);let tt=0;
const f=()=>{if(!$('#wxmap8')||!cv.isConnected)return;tt+=.01;ctx.globalCompositeOperation='destination-out';ctx.fillStyle='rgba(0,0,0,.08)';ctx.fillRect(0,0,cv.width,cv.height);ctx.globalCompositeOperation='source-over';ctx.lineWidth=1.2;
P.forEach(p=>{const nx=Math.sin(p.y/60+tt*2)*.35,ny=Math.cos(p.x/70+tt*2)*.35;const dx=vx+nx,dy=vy+ny;ctx.strokeStyle=`rgba(25,70,150,${.35+.3*Math.sin(p.a*6.28)})`;ctx.beginPath();ctx.moveTo(p.x,p.y);p.x+=dx;p.y+=dy;ctx.lineTo(p.x,p.y);ctx.stroke();p.a+=.002;if(p.x<0||p.x>cv.width||p.y<0||p.y>cv.height||Math.random()<.004){p.x=rnd()*cv.width;p.y=rnd()*cv.height}});WX8.raf=requestAnimationFrame(f)};f()}
